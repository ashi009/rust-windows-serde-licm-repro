[package]
name = "wide-serde-repro"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.143"

[profile.release]
opt-level = 3
debug = 0
strip = "debuginfo"
codegen-units = 16
incremental = false
