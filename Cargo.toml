[workspace]
resolver = "2"
members = [
    "primer",
    "monolithic",
    "flattened",
    "model_only",
    "boundary_model",
    "direct_consumer",
    "boundary_consumer",
    "runtime_bench",
]

[workspace.package]
edition = "2021"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.143"

[profile.release]
opt-level = 3
debug = 0
strip = "debuginfo"
codegen-units = 16
incremental = false

